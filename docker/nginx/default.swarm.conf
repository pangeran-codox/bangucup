server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    # index.html duluan supaya React SPA yang di-serve, bukan index.php
    index index.html index.php;

    # Batas upload sesuai php.ini
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/x-font-ttf font/opentype image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"        always;
    add_header X-Frame-Options         "SAMEORIGIN"     always;
    add_header X-XSS-Protection        "1; mode=block"  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Asset statis: cache panjang, tidak perlu ke PHP
    location ~* \.(css|js|woff2?|ttf|eot|otf|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Laravel API routes → PHP-FPM
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # React SPA — semua route non-API, non-file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP-FPM — pakai DNS resolver Docker Swarm (127.0.0.11) untuk
    # resolve nama service "bangucup_app" secara dinamis.
    # Kalau container app restart/scale, nginx tidak perlu restart.
    location ~ \.php$ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream bangucup_app:9000;
        fastcgi_pass $upstream;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Forward real IP dari reverse proxy / load balancer di depan
        fastcgi_param HTTP_X_REAL_IP       $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }

    # Sembunyikan file tersembunyi (.env, .git, dll)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Health-check endpoint — tidak perlu ke PHP
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
