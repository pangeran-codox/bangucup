services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bangucup-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - vendor_data:/var/www/html/vendor
    networks:
      - infra

  nginx:
    image: nginx:stable-alpine
    container_name: bangucup-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - infra

  # ─── Scheduler (cron artisan) ────────────────────────────────────
  # Menjalankan `php artisan schedule:run` tiap menit (billing, genieacs sync).
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bangucup-scheduler
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - vendor_data:/var/www/html/vendor
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    depends_on:
      - app
    networks:
      - infra

  node:
    image: node:22-alpine
    container_name: bangucup-node
    restart: unless-stopped
    working_dir: /app
    volumes:
      # Source frontend di-mount ke /app (bukan /var/www/html agar tidak bentrok dengan PHP)
      - ./frontend/admin:/app
      # node_modules pakai named volume Linux — tidak pakai node_modules dari Windows host
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    # Install deps dulu (pakai node_modules Linux), lalu jalankan dev server
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - infra

  # ─── Go: MikroTik Collector ─────────────────────────────────────
  # Poll semua router tiap 5 detik → Redis Pub/Sub
  mikrotik-collector:
    build:
      context: ./services/mikrotik-collector
      dockerfile: Dockerfile
    container_name: bangucup-collector
    restart: unless-stopped
    environment:
      REDIS_ADDR:        redis:6379
      REDIS_PASSWORD:    ${REDIS_PASSWORD:-}
      REDIS_DB:          ${REDIS_DB:-0}
      LARAVEL_API_URL:   http://bangucup-nginx/api
      # Token Sanctum dari user admin — set di .env
      LARAVEL_API_TOKEN: ${COLLECTOR_API_TOKEN:-}
      POLL_INTERVAL_SEC: ${POLL_INTERVAL_SEC:-5}
    depends_on:
      - app
      - nginx
    networks:
      - infra

  # ─── Go: Realtime Gateway ────────────────────────────────────────
  # Subscribe Redis → broadcast ke browser via WebSocket
  realtime-gateway:
    build:
      context: ./services/realtime-gateway
      dockerfile: Dockerfile
    container_name: bangucup-gateway
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      LISTEN_ADDR:    :8081
      REDIS_ADDR:     redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB:       ${REDIS_DB:-0}
      ALLOWED_ORIGIN: "*"
    depends_on:
      - mikrotik-collector
    networks:
      - infra

networks:
  infra:
    external: true
    name: network

volumes:
  vendor_data:
    driver: local
  node_modules_data:
    driver: local
  frontend_node_modules:
    driver: local