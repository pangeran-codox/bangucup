services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bangucup-app
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - infra

  nginx:
    image: nginx:stable-alpine
    container_name: bangucup-nginx
    ports:
      - "8084:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - infra

  node:
    image: node:22-alpine
    container_name: bangucup-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - infra

networks:
  infra:
    external: true
    name: network
