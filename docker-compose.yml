services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: bangucup-app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - vendor_data:/var/www/html/vendor
    networks:
      - infra

  nginx:
    image: nginx:stable-alpine
    container_name: bangucup-nginx
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - infra

  node:
    image: node:22-alpine
    container_name: bangucup-node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - infra

networks:
  infra:
    external: true
    name: network

volumes:
  vendor_data:
    driver: local
  node_modules_data:
    driver: local